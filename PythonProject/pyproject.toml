[project]
name = "pythonproject"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ethan_Leo", email = "xuesongzhi813@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20",
    "asyncmy>=0.2.9",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "langchain>=1.3.13",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.14.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "mcp>=1.28.1",
    "openai>=2.45.0",
    "pydantic-settings>=2.14.2",
    "pymilvus[milvus-lite]>=3.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.5.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
pythonproject = "pythonproject:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
